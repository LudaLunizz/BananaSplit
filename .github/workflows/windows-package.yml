name: Build Windows 0.2.7

on:
  workflow_dispatch:
  push:
    paths:
      - '0.2.7 windows version/bananasplit/**'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain for the build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build portable executable
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE '0.2.7 windows version/bananasplit'
          $manifest = Join-Path $sourceRoot 'Cargo.toml'
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $exe = Join-Path $sourceRoot 'target/x86_64-pc-windows-msvc/release/bananasplit.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Build did not produce bananasplit.exe: $exe" }
          Copy-Item -LiteralPath $exe -Destination 'dist/bananasplit.exe'
          Copy-Item -LiteralPath '0.2.7 windows version/README.txt' -Destination 'dist/README.txt'
          $hash = (Get-FileHash -LiteralPath 'dist/bananasplit.exe' -Algorithm SHA256).Hash
          "$hash  bananasplit.exe" | Set-Content -LiteralPath 'dist/bananasplit.exe.sha256' -Encoding ascii
          Compress-Archive -Path 'dist/bananasplit.exe', 'dist/bananasplit.exe.sha256', 'dist/README.txt' -DestinationPath 'dist/BananaSplit-0.2.7-windows-x64.zip' -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: BananaSplit-Windows-0.2.7
          path: |
            dist/BananaSplit-0.2.7-windows-x64.zip
            dist/bananasplit.exe.sha256
          if-no-files-found: error
          retention-days: 90

