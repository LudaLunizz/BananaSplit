name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The shared mixer core, on every system it ships on: config and recorder
  # have per-OS branches (config folder, `~` expansion, connect hints).
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core

      - name: Unit tests
        run: cargo test --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # Dependencies: known vulnerabilities (RustSec), unmaintained or yanked
  # crates, licences that don't fit GPL-3.0-or-later, and crates from
  # anywhere but crates.io. Rules in deny.toml; each crate is checked for the
  # targets it ships on, so Linux-only crates of a dependency (GTK under wry)
  # don't count against Windows and macOS. Issue #115.
  audit:
    name: Audit (${{ matrix.crate }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: core, target: x86_64-unknown-linux-gnu }
          - { crate: core, target: x86_64-pc-windows-msvc }
          - { crate: core, target: aarch64-apple-darwin }
          - { crate: linux, target: x86_64-unknown-linux-gnu }
          - { crate: windows, target: x86_64-pc-windows-msvc }
          - { crate: macos, target: aarch64-apple-darwin }
          - { crate: macos, target: x86_64-apple-darwin }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      - name: cargo deny check
        working-directory: ${{ matrix.crate }}
        run: cargo deny --target ${{ matrix.target }} --config ../deny.toml check

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: linux

      - name: Build
        run: cargo build --locked --release

      - name: Unit tests
        run: cargo test --locked

      # Lint settings are in Cargo.toml ([lints]); every unsafe block needs
      # a `// SAFETY:` note.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: End-to-end tests
        run: sh tests/e2e/run_e2e.sh

      - name: Build and check packages
        run: sh packaging/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bananasplit-linux-x86_64
          path: linux/dist/*
          if-no-files-found: error
          retention-days: 14

  linux-window:
    name: Linux window and tray
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus libgtk-3-dev python3-dbus python3-gi gir1.2-gtk-3.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: linux

      - name: Build
        run: cargo build --locked --release

      - name: Window and tray tests
        env:
          PYTHON: /usr/bin/python3
        run: sh tests/window/run_window_test.sh

  linux-gui:
    name: Linux GUI (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: linux

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        run: cargo build --locked --release

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      # The page's first-choice font. Without it Chromium falls back to
      # DejaVu Sans, which is too wide for the name-fitting checks.
      - name: Install fonts
        run: sudo apt-get install -y --no-install-recommends fonts-inter

      - name: Build mock JACK server
        run: gcc -shared -fPIC -O2 -o tests/e2e/libjack.so.0 tests/e2e/mockjack.c -lpthread -lm

      - name: GUI tests
        run: node tests/gui/ui_check.js

  macos:
    name: macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: macos

      - name: Unit tests
        run: cargo test --locked

      # Lint settings are in Cargo.toml ([lints]); every unsafe block needs
      # a `// SAFETY:` note. Intel too: the runner is Apple silicon.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --target x86_64-apple-darwin -- -D warnings

      - name: Build the app (Apple silicon and Intel)
        run: sh packaging/bundle.sh

      - name: Start, ask, start again and quit the app
        run: sh tests/launch/smoke.sh dist/BananaSplit.app

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bananasplit-macos
          path: macos/dist/bananasplit-*-macos.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, toolchain stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Unit tests
        run: cargo test --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bananasplit-windows-x64
          path: windows/target/x86_64-pc-windows-msvc/release/bananasplit.exe
          if-no-files-found: error
          retention-days: 14

  windows-launch:
    name: Windows launch
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bananasplit-windows-x64
          path: dist

      - name: Start, open, restart and quit the app
        shell: pwsh
        run: ./windows/tests/launch/smoke.ps1 -Exe dist/bananasplit.exe

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-launch-screenshots
          path: ${{ runner.temp }}/bs-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
