name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Build
        run: cargo build --locked --release

      - name: Unit tests
        run: cargo test --locked

      # Lint settings are in Cargo.toml ([lints]); every unsafe block needs
      # a `// SAFETY:` note.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: End-to-end tests
        run: sh tests/e2e/run_e2e.sh

      - name: Build and check packages
        run: sh packaging/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: bananasplit-linux-x86_64
          path: linux/dist/*
          if-no-files-found: error
          retention-days: 14

  linux-window:
    name: Linux window and tray
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus libgtk-3-dev python3-dbus python3-gi gir1.2-gtk-3.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Build
        run: cargo build --locked --release

      - name: Window and tray tests
        env:
          PYTHON: /usr/bin/python3
        run: sh tests/window/run_window_test.sh

  linux-gui:
    name: Linux GUI (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: cargo build --locked --release

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      # The page's first-choice font. Without it Chromium falls back to
      # DejaVu Sans, which is too wide for the name-fitting checks.
      - name: Install fonts
        run: sudo apt-get install -y --no-install-recommends fonts-inter

      - name: Build mock JACK server
        run: gcc -shared -fPIC -O2 -o tests/e2e/libjack.so.0 tests/e2e/mockjack.c -lpthread -lm

      - name: GUI tests
        run: node tests/gui/ui_check.js

  macos:
    name: macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos

      - name: Unit tests
        run: cargo test --locked

      - name: Build the app (Apple silicon and Intel)
        run: sh packaging/bundle.sh

      - name: Start, ask, start again and quit the app
        run: sh tests/launch/smoke.sh dist/BananaSplit.app

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: bananasplit-macos
          path: macos/dist/bananasplit-*-macos.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Unit tests
        run: cargo test --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bananasplit-windows-x64
          path: windows/target/x86_64-pc-windows-msvc/release/bananasplit.exe
          if-no-files-found: error
          retention-days: 14

  windows-launch:
    name: Windows launch
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bananasplit-windows-x64
          path: dist

      - name: Start, open, restart and quit the app
        shell: pwsh
        run: ./windows/tests/launch/smoke.ps1 -Exe dist/bananasplit.exe

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-launch-screenshots
          path: ${{ runner.temp }}/bs-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
