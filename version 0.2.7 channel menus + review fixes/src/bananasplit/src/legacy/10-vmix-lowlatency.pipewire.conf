# vmix: fixed 48 kHz / 128-frame graph  ->  2.67 ms per period.
# Install:  mkdir -p ~/.config/pipewire/pipewire.conf.d
#           cp 10-vmix-lowlatency.conf ~/.config/pipewire/pipewire.conf.d/
#           systemctl --user restart pipewire pipewire-pulse wireplumber
#
# max-quantum = 128 means NO client can push the period above 2.67 ms, so the
# hardware round trip stays ~2 periods + driver headroom (typically 6-8 ms).
# allowed-rates = 48000 keeps the device at 48 kHz (no resampling in the path).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 128
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 128
}
