[package]
name = "bananasplit"
version = "2.8.4"
edition = "2024"
description = "6-strip, 5-bus low-latency virtual audio mixer for Linux (JACK / PipeWire) as a desktop app, with EQ, a recorder and player, scenes and Voicemeeter-compatible VBAN"
license = "MIT"
rust-version = "1.85"

# Intentionally zero dependencies: libjack is loaded at runtime with dlopen,
# so the same binary works with JACK2 and with PipeWire's libjack.
[dependencies]

[lib]
name = "bananasplit"
path = "src/lib.rs"

[[bin]]
name = "bananasplit"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# The VBAN clock-drift and EQ tests simulate minutes of audio; optimized,
# they finish in about a minute instead of five. Debug assertions stay on.
[profile.test]
opt-level = 2
