<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>BananaSplit Deck</title>
<style>
/* The touch deck: the everyday controls only, big enough for a finger, on a
   small screen (drawn for 1024x600 and 1280x600, works on a phone held
   sideways). Same palette and theme switch as the main page (gui.html):
   data-theme on <html> is set by BananaSplit when it serves the page. */
:root {
  --bg: #0b1015; --panel: #11191f; --panel-edge: #1f2c34; --card: #151d23; --card-edge: #293840;
  --sunk: #0b1115; --raised: #20292f; --raised-edge: #34424a; --off: #26333a;
  --cap: #d6e0e3; --cap-edge: #a9b6bb; --text: #e7eef0; --muted: #829198; --dim: #47535a;
  --green: #65dba7; --teal: #31d6bf; --purple: #d18bff; --blue: #78afff; --amber: #f3c15b; --red: #ff616e;
  --focus: #7aa7ff; --overlay: rgba(6, 10, 13, .82);
  --font: "Inter", "Cantarell", "Ubuntu", "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Ubuntu Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  --gap: clamp(4px, 0.9vmin, 8px);
  --touch: clamp(40px, 8.2vh, 56px);   /* smallest thing to hit */
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e7ecef; --panel: #f3f6f8; --panel-edge: #d3dce1; --card: #fbfcfd; --card-edge: #d0d9de;
  --sunk: #dde4e8; --raised: #eef2f4; --raised-edge: #c5d0d6; --off: #c9d3d9;
  --cap: #ffffff; --cap-edge: #8e9da5; --text: #0f171c; --muted: #56656d; --dim: #a4b0b7;
  --green: #17945f; --teal: #0e9585; --purple: #9147cf; --blue: #2c6fcb; --amber: #b67a07; --red: #d6303f;
  --focus: #2f6fed; --overlay: rgba(231, 236, 239, .86);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #e7ecef; --panel: #f3f6f8; --panel-edge: #d3dce1; --card: #fbfcfd; --card-edge: #d0d9de;
    --sunk: #dde4e8; --raised: #eef2f4; --raised-edge: #c5d0d6; --off: #c9d3d9;
    --cap: #ffffff; --cap-edge: #8e9da5; --text: #0f171c; --muted: #56656d; --dim: #a4b0b7;
    --green: #17945f; --teal: #0e9585; --purple: #9147cf; --blue: #2c6fcb; --amber: #b67a07; --red: #d6303f;
    --focus: #2f6fed; --overlay: rgba(231, 236, 239, .86);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--text); font: clamp(12px, 2.4vh, 16px)/1.25 var(--font);
  overflow: hidden; display: flex; flex-direction: column; height: 100dvh;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---- top bar ---- */
header {
  flex: none; display: flex; align-items: center; gap: var(--gap);
  padding: var(--gap); background: var(--panel); border-bottom: 1px solid var(--panel-edge);
}
.brand { font-weight: 700; letter-spacing: .02em; padding: 0 6px; white-space: nowrap; }
.brand b { color: var(--teal); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.on { background: var(--green); }
.btn {
  min-height: var(--touch); min-width: var(--touch); padding: 0 14px; border-radius: 8px;
  background: var(--raised); border: 1px solid var(--raised-edge); font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn:active { filter: brightness(1.25); }
.tabs { display: flex; gap: var(--gap); margin-left: auto; }
.tab[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--bg); }
.rec .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--red); }
.rec[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.rec[aria-pressed="true"] .ring { background: #fff; border-color: #fff; }
a.btn { text-decoration: none; color: var(--muted); }

/* ---- columns ---- */
main { flex: 1; min-height: 0; display: flex; gap: var(--gap); padding: var(--gap); }
main[hidden] { display: none; }
.col {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap);
  background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; padding: var(--gap);
}
.col.muted .name { opacity: .55; }
.name { font-weight: 700; font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.strip .name { color: var(--green); }
.bus.a .name { color: var(--blue); }
.bus.b .name { color: var(--purple); }
.sub { color: var(--muted); font-size: .78em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; margin-top: -2px; }
.db { text-align: center; font-size: 1.15em; font-weight: 600; }

/* fader + meter */
.fz { flex: 1; min-height: 60px; display: flex; gap: 6px; }
.meter { width: clamp(8px, 1.4vw, 14px); border-radius: 4px; position: relative; overflow: hidden;
  background: linear-gradient(to top, var(--green) 0 70%, var(--amber) 70% 90%, var(--red) 90%); }
.meter i { position: absolute; left: 0; right: 0; top: 0; background: var(--sunk); height: 100%; }
.col.muted .meter { filter: grayscale(1) opacity(.6); }
.track { flex: 1; position: relative; border-radius: 8px; background: var(--sunk); touch-action: none; cursor: ns-resize; }
.track::before { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--off); }
.track .zero { position: absolute; left: 12%; right: 12%; height: 2px; background: var(--dim); }
.track .fill { position: absolute; left: 50%; bottom: 8px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--teal); }
.cap {
  position: absolute; left: 6%; right: 6%; height: var(--cap-h, 44px); border-radius: 7px;
  background: var(--cap); border: 1px solid var(--cap-edge); box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.cap::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 2px; margin-top: -1px; background: var(--cap-edge); }
.track.drag .cap { background: var(--teal); border-color: var(--teal); }

.row { display: grid; gap: var(--gap); }
.row.two { grid-template-columns: 1fr 1fr; }
.row.three { grid-template-columns: repeat(3, 1fr); }
.k {
  min-height: var(--touch); border-radius: 8px; background: var(--raised); border: 1px solid var(--raised-edge);
  font-weight: 700; padding: 0; min-width: 0;
}
.k:active { filter: brightness(1.25); }
.k.mute[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.k.solo[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #111; }
.k.ra[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.k.rb[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
.feeds { min-height: var(--touch); display: flex; align-items: center; justify-content: center; text-align: center;
  color: var(--muted); font-size: .8em; line-height: 1.2; }

/* ---- connection lost ---- */
#overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; text-align: center; padding: 24px; }
#overlay.show { display: flex; }
#overlay h1 { margin: 0; font-size: 1.4em; }
#overlay p { margin: 0; color: var(--muted); max-width: 40ch; }
#toast { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--red);
  border-radius: 8px; padding: 8px 14px; display: none; max-width: 90vw; }
#toast.show { display: block; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="Connection to BananaSplit"></span>
  <span class="brand"><b>BananaSplit</b> Deck</span>
  <button class="btn rec" id="rec" aria-pressed="false"><span class="ring"></span><span id="rectxt">REC</span></button>
  <div class="tabs">
    <button class="btn tab" data-view="strips" aria-pressed="true">Strips</button>
    <button class="btn tab" data-view="buses" aria-pressed="false">Buses</button>
    <a class="btn" href="/" title="The full mixer">Mixer</a>
  </div>
</header>
<main id="strips"></main>
<main id="buses" hidden></main>
<div id="overlay" class="show"><h1 id="ov-h">Connecting to BananaSplit…</h1><p id="ov-p">This page is served by BananaSplit on this computer.</p></div>
<div id="toast"></div>
<script>
"use strict";
// Same numbers as gui.html and engine.rs: 6 input strips, then buses A1 A2 A3 B1 B2.
const NUM_STRIPS = 6, BUS_IDS = ["A1", "A2", "A3", "B1", "B2"];
const MIN_DB = -60, MAX_DB = 12;
// Fader taper: more travel around 0 dB (same as gui.html).
const TAPER = [[-60, 0], [-36, .15], [-24, .3], [-12, .55], [0, .8], [12, 1]];
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function dbToPos(db) {
  db = clamp(db, MIN_DB, MAX_DB);
  for (let i = 1; i < TAPER.length; i++) {
    const [d0, p0] = TAPER[i - 1], [d1, p1] = TAPER[i];
    if (db <= d1) return p0 + (p1 - p0) * (db - d0) / (d1 - d0);
  }
  return 1;
}
function posToDb(p) {
  p = clamp(p, 0, 1);
  for (let i = 1; i < TAPER.length; i++) {
    const [d0, p0] = TAPER[i - 1], [d1, p1] = TAPER[i];
    if (p <= p1) return d0 + (d1 - d0) * (p - p0) / (p1 - p0);
  }
  return MAX_DB;
}
const fmtDb = (v) => (v <= MIN_DB ? "−∞" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1));
const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };
const setPressed = (el, on) => { const v = on ? "true" : "false"; if (el.getAttribute("aria-pressed") !== v) el.setAttribute("aria-pressed", v); };

// A control the user just touched ignores the server for a moment, so the
// next frame (sent before the command landed) does not flick it back.
const holds = new Map();
const hold = (k, ms = 700) => holds.set(k, performance.now() + ms);
const held = (k) => (holds.get(k) || 0) > performance.now();

let toastTimer = 0;
function toast(text) {
  const t = $("toast");
  setText(t, text);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 5000);
}
async function send(params) {
  try {
    const r = await fetch("/api/cmd", {
      method: "POST",
      headers: { "X-BananaSplit": "1", "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(params).toString(),
    });
    if (!r.ok) toast(await r.text());
    return r.ok;
  } catch (e) {
    toast("BananaSplit is not answering");
    return false;
  }
}

// Gain: at most one request in flight per channel; the newest value wins.
const gainQ = new Map();
function sendGain(ch, v) {
  const q = gainQ.get(ch) || { busy: false, want: null };
  gainQ.set(ch, q);
  q.want = v;
  if (q.busy) return;
  const next = () => {
    if (q.want === null) { q.busy = false; return; }
    const val = q.want;
    q.want = null;
    q.busy = true;
    send({ op: "gain", ch, v: val.toFixed(1) }).then(next);
  };
  next();
}

// ---- building the columns ----
const cols = [];   // index = BananaSplit channel number
const resized = new ResizeObserver((es) => es.forEach((e) => { const c = cols.find((c) => c && c.u.track === e.target); if (c) draw(c.u); }));
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fader(col, ch) {
  const fz = el("div", "fz");
  const meter = el("div", "meter");
  const cover = el("i");
  meter.append(cover);
  const track = el("div", "track");
  track.setAttribute("role", "slider");
  track.setAttribute("aria-valuemin", MIN_DB);
  track.setAttribute("aria-valuemax", MAX_DB);
  track.tabIndex = 0;
  const zero = el("div", "zero"), fill = el("div", "fill"), cap = el("div", "cap");
  track.append(zero, fill, cap);
  fz.append(meter, track);
  const u = { ch, gain: 0, drag: null, lastTap: 0, track, cap, fill, zero, cover };
  col.u = u;
  // Redraw whenever the fader changes size: text filling in, a tab shown,
  // the window resized or a phone turned.
  resized.observe(track);
  // Drag moves the fader by the finger's travel (a tap never jumps it);
  // a double tap puts it at 0 dB.
  track.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    track.setPointerCapture(e.pointerId);
    u.drag = { id: e.pointerId, y: e.clientY, pos: dbToPos(u.gain), moved: false };
    track.classList.add("drag");
  });
  track.addEventListener("pointermove", (e) => {
    const d = u.drag;
    if (!d || d.id !== e.pointerId) return;
    const travel = track.clientHeight - cap.offsetHeight - 16;
    const dy = e.clientY - d.y;
    if (!d.moved && Math.abs(dy) < 4) return;
    d.moved = true;
    let v = Math.round(posToDb(d.pos - dy / Math.max(40, travel)) * 10) / 10;
    if (Math.abs(v) < 0.6) v = 0;   // a small notch at 0 dB
    if (v !== u.gain) { u.gain = v; hold("gain" + ch); draw(u); sendGain(ch, v); }
  });
  const end = (e) => {
    const d = u.drag;
    if (!d || d.id !== e.pointerId) return;
    u.drag = null;
    track.classList.remove("drag");
    hold("gain" + ch);
    if (!d.moved) {
      const now = performance.now();
      if (now - u.lastTap < 350) { u.gain = 0; draw(u); sendGain(ch, 0); u.lastTap = 0; }
      else u.lastTap = now;
    }
  };
  track.addEventListener("pointerup", end);
  track.addEventListener("pointercancel", end);
  track.addEventListener("keydown", (e) => {
    const step = { ArrowUp: 0.5, ArrowDown: -0.5, PageUp: 3, PageDown: -3 }[e.key];
    if (step === undefined) return;
    e.preventDefault();
    u.gain = clamp(Math.round((u.gain + step) * 10) / 10, MIN_DB, MAX_DB);
    hold("gain" + ch);
    draw(u);
    sendGain(ch, u.gain);
  });
  return fz;
}
function draw(u) {
  const { track, cap, fill, zero } = u;
  const h = track.clientHeight;
  const ch = Math.round(clamp(h * 0.14, 34, 56));
  cap.style.setProperty("--cap-h", ch + "px");
  const travel = Math.max(0, h - ch - 16);
  const pos = dbToPos(u.gain);
  cap.style.top = (8 + (1 - pos) * travel) + "px";
  fill.style.height = Math.max(0, pos * travel + ch / 2) + "px";
  zero.style.top = (8 + (1 - dbToPos(0)) * travel + ch / 2 - 1) + "px";
  track.setAttribute("aria-valuenow", u.gain.toFixed(1));
  setText(u.db, fmtDb(u.gain) + " dB");
}
function build(S) {
  const strips = $("strips"), buses = $("buses");
  resized.disconnect();
  strips.textContent = "";
  buses.textContent = "";
  cols.length = 0;
  S.ch.forEach((c, ch) => {
    const strip = ch < NUM_STRIPS;
    const bus = strip ? "" : BUS_IDS[ch - NUM_STRIPS] || "";
    const col = el("section", "col " + (strip ? "strip" : "bus " + (bus[0] === "A" ? "a" : "b")));
    col.ch = ch;
    col.nameEl = el("div", "name");
    col.subEl = el("div", "sub");
    const db = el("div", "db num");
    col.append(col.nameEl, col.subEl, db);
    col.append(fader(col, ch));
    col.u.db = db;
    const keys = el("div", "row two");
    col.mute = el("button", "k mute", "MUTE");
    col.mute.addEventListener("click", () => {
      const on = col.mute.getAttribute("aria-pressed") !== "true";
      hold("mute" + ch); setPressed(col.mute, on); col.classList.toggle("muted", on);
      send({ op: "mute", ch, v: on ? 1 : 0 });
    });
    keys.append(col.mute);
    if (strip) {
      col.solo = el("button", "k solo", "SOLO");
      col.solo.addEventListener("click", () => {
        const on = col.solo.getAttribute("aria-pressed") !== "true";
        hold("solo" + ch); setPressed(col.solo, on);
        send({ op: "solo", ch, v: on ? 1 : 0 });
      });
      keys.append(col.solo);
    } else {
      keys.className = "row";
    }
    col.append(keys);
    if (strip) {
      col.routes = BUS_IDS.map((id, b) => {
        const k = el("button", "k " + (id[0] === "A" ? "ra" : "rb"), id);
        k.addEventListener("click", () => {
          const on = k.getAttribute("aria-pressed") !== "true";
          hold("route" + ch + "_" + b); setPressed(k, on);
          send({ op: "route", ch, bus: b, v: on ? 1 : 0 });
        });
        return k;
      });
      const r1 = el("div", "row three"), r2 = el("div", "row two");
      r1.append(...col.routes.slice(0, 3));
      r2.append(...col.routes.slice(3));
      col.append(r1, r2);
      strips.append(col);
    } else {
      col.feeds = el("div", "feeds");
      col.append(col.feeds);
      buses.append(col);
    }
    cols[ch] = col;
  });
  requestAnimationFrame(() => cols.forEach((c) => c && draw(c.u)));
}

// ---- drawing a frame ----
let shape = "";
function render(S) {
  const now = S.ch.map((c) => c.id).join(",");
  if (now !== shape) { shape = now; build(S); }
  S.ch.forEach((c, ch) => {
    const col = cols[ch];
    if (!col) return;
    const strip = ch < NUM_STRIPS;
    setText(col.nameEl, strip ? c.name : c.id === c.name ? c.id : c.id + " · " + c.name);
    setText(col.subEl, c.dev || "");
    if (!held("gain" + ch) && !col.u.drag && c.gain !== col.u.gain) { col.u.gain = c.gain; draw(col.u); }
    if (!held("mute" + ch)) { setPressed(col.mute, c.mute); col.classList.toggle("muted", !!c.mute); }
    if (col.solo && !held("solo" + ch)) setPressed(col.solo, !!c.solo);
    if (col.routes) col.routes.forEach((k, b) => { if (!held("route" + ch + "_" + b)) setPressed(k, (c.routes >> b) & 1); });
    const lvl = Math.max(...(c.m || [-60]));
    col.u.cover.style.height = (100 - clamp((lvl + 60) / 60, 0, 1) * 100).toFixed(1) + "%";
  });
  // Which strips feed each bus (shown under the bus).
  cols.forEach((col, ch) => {
    if (!col || !col.feeds) return;
    const b = ch - NUM_STRIPS;
    const from = S.ch.slice(0, NUM_STRIPS).filter((c) => (c.routes >> b) & 1).map((c) => c.name);
    setText(col.feeds, from.length ? "from " + from.join(", ") : "nothing routed");
  });
  const R = S.rec || {};
  if (!held("rec")) setPressed($("rec"), !!R.on);
  const secs = Math.floor(R.secs || 0);
  setText($("rectxt"), R.on ? String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0") : "REC");
}
$("rec").addEventListener("click", () => {
  const on = $("rec").getAttribute("aria-pressed") !== "true";
  hold("rec", 1200); setPressed($("rec"), on);
  send({ op: "rec", v: on ? 1 : 0 }).then((ok) => { if (!ok) holds.delete("rec"); });
});

// ---- tabs: /deck#buses opens on the buses ----
function showView(v) {
  if (v !== "buses") v = "strips";
  document.querySelectorAll(".tab").forEach((t) => setPressed(t, t.dataset.view === v));
  $("strips").hidden = v !== "strips";
  $("buses").hidden = v !== "buses";
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => showView(t.dataset.view)));
showView(location.hash.slice(1));

// ---- connection ----
let lastMsg = 0, events = null, hiddenFrame = null;
function connect() {
  const es = new EventSource("/api/events");
  events = es;
  es.onmessage = (ev) => {
    lastMsg = performance.now();
    $("overlay").classList.remove("show");
    $("dot").classList.add("on");
    if (document.hidden) { hiddenFrame = ev.data; return; }
    showFrame(ev.data);
  };
  es.onerror = () => {
    if (es.readyState !== EventSource.CLOSED || events !== es) return;
    setTimeout(() => { if (events === es) connect(); }, 2000);
  };
}
function showFrame(data) {
  let S;
  try { S = JSON.parse(data); } catch (e) { return; }
  if (S.ch) render(S);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && hiddenFrame !== null) { const d = hiddenFrame; hiddenFrame = null; showFrame(d); }
});
setInterval(() => {
  if (performance.now() - lastMsg > 2500) {
    setText($("ov-h"), "Lost connection to BananaSplit");
    setText($("ov-p"), "Trying again. If BananaSplit stopped, start it from the app menu or with bananasplit --gui.");
    $("overlay").classList.add("show");
    $("dot").classList.remove("on");
  }
}, 1000);
connect();
</script>
</body>
</html>
