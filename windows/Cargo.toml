[package]
name = "bananasplit"
version = "2.8.8"
edition = "2024"
description = "6-strip, 5-bus low-latency virtual audio mixer for Windows (WASAPI), with EQ, a recorder and player, scenes and Voicemeeter-compatible VBAN"
license = "MIT"
rust-version = "1.85"

# WASAPI and most Win32 APIs use hand-declared FFI (src/win/ffi.rs). The native
# desktop window uses Tao/Wry and the installed Microsoft WebView2 Runtime.
[dependencies]

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"

[lib]
name = "bananasplit"
path = "src/lib.rs"

[[bin]]
name = "bananasplit"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# The VBAN clock-drift and EQ tests simulate minutes of audio; optimized,
# they finish in about a minute instead of five. Debug assertions stay on.
[profile.test]
opt-level = 2
