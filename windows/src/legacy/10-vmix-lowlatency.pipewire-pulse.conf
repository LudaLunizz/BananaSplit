# vmix: smaller default buffers for PulseAudio-API apps (browsers, Discord, games).
# Apps that request their own buffer size still get what they ask for.
# Install into ~/.config/pipewire/pipewire-pulse.conf.d/ and restart pipewire-pulse.
pulse.properties = {
    pulse.min.req     = 128/48000
    pulse.default.req = 128/48000
    pulse.min.quantum = 128/48000
}
