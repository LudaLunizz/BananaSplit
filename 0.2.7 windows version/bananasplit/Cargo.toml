[package]
name = "bananasplit"
version = "2.7.0"
edition = "2024"
description = "6-strip, 5-bus low-latency virtual audio mixer for Windows (WASAPI), with EQ, a recorder and player, scenes and Voicemeeter-compatible VBAN"
license = "MIT"
rust-version = "1.85"

# Intentionally zero dependencies: this build talks to WASAPI and the Win32
# APIs through hand-declared FFI (see src/win/ffi.rs), so the .exe is a single
# self-contained file with no runtime DLLs besides the Windows system ones.
[dependencies]

[lib]
name = "bananasplit"
path = "src/lib.rs"

[[bin]]
name = "bananasplit"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# The VBAN clock-drift and EQ tests simulate minutes of audio; optimized,
# they finish in about a minute instead of five. Debug assertions stay on.
[profile.test]
opt-level = 2
